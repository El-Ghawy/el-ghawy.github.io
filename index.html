<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منيو بن الغاوي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
/*
VOICE: دافي وشعبي وواضح، زي كوباية قهوة على ناصية في إمبابة
IDEA: كارت منيو مطبوع لمحل بن، بالنبيتي والأصفر بتوع البراند
PICTURE: هيدر نبيتي فيه فنجان قهوة مرسوم وبخار طالع وحبوب بن
COLOUR and TYPE: نبيتي #6e1222 أساسي، أصفر #f6d40c أكسنت، أبيض/كريمي خلفية؛ Lalezar للعناوين و Cairo للنص
LAYOUT: هيدر، شريط أقسام ثابت فوق، بحث، كروت أقسام في عمود واحد على الموبايل وعمودين على الشاشة الكبيرة
*/
:root{color-scheme:light dark;
--bg:light-dark(#fbf7f1,#1a0d10);--card:light-dark(#ffffff,#2a1419);--ink:light-dark(#2a1216,#f7ece9);
--soft:light-dark(#7d5b60,#c7a9ad);--line:light-dark(#efe3dc,#3d2228);
--wine:#6e1222;--wine2:#8d1b2f;--yel:#f6d40c;--chip:light-dark(#fff3b0,#3a2a0a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Cairo",system-ui,sans-serif;overflow-x:clip}
html{scroll-padding-top:120px;scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.steam path{animation:none!important}}

header{background:var(--wine);color:#fff;position:relative;overflow:hidden;padding:28px max(5vw,18px) 34px}
header::after{content:"";position:absolute;inset:auto 0 -1px 0;height:26px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.hwrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;position:relative;z-index:1}
.brand{font-family:"Lalezar","Cairo",sans-serif;font-size:clamp(46px,11vw,78px);line-height:1;margin:0;font-weight:400}
.brand b{color:var(--yel);font-weight:400}
.tag{display:inline-block;background:var(--yel);color:var(--wine);font-weight:800;border-radius:999px;padding:4px 16px;margin-top:10px;font-size:17px}
.sub{margin:12px 0 0;color:#f3d6db;font-size:15px}
.cup{width:clamp(120px,30vw,200px);height:auto}
.steam path{animation:rise 3.2s ease-in-out infinite;transform-box:fill-box}
.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}

nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.navin{max-width:1100px;margin:0 auto;padding:10px max(5vw,14px) 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px;min-height:42px;display:flex;align-items:center}
.navin a.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.search{max-width:1100px;margin:0 auto;padding:0 max(5vw,14px) 10px}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.search input:focus{outline:3px solid var(--yel);border-color:var(--wine)}

main{max-width:1100px;margin:0 auto;padding:18px max(5vw,14px) 30px;columns:2 460px;column-gap:18px}
.sec{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:22px;margin:0 0 18px;overflow:hidden;display:inline-block;width:100%}
.sec h2{margin:0;background:var(--wine);color:#fff;font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:28px;line-height:1.2;padding:14px 20px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.flat{font-family:"Cairo",sans-serif;font-size:14px;font-weight:800;background:var(--yel);color:var(--wine);border-radius:999px;padding:3px 12px;white-space:nowrap}
.note{margin:0;padding:10px 20px 0;color:var(--soft);font-size:14px}
ul{list-style:none;margin:0;padding:8px 20px 14px}
li{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
.n{font-weight:700}
.d{display:block;font-size:13px;color:var(--soft);font-weight:600}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.p{white-space:nowrap;font-weight:800;color:var(--wine2);font-size:18px}
:root[data-theme=dark] .p{color:var(--yel)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .p{color:var(--yel)}}
.p small{font-size:12px;font-weight:700;color:var(--soft);margin-inline-start:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px 18px}
.chips span{background:var(--chip);border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px}
.empty{display:none;text-align:center;color:var(--soft);padding:30px;column-span:all}

footer{background:var(--wine);color:#fff;padding:26px max(5vw,18px) 34px}
.fin{max-width:1100px;margin:0 auto;display:grid;gap:8px}
.fin b{color:var(--yel)}
.fin a{color:#fff}
.upd{font-size:13px;color:#e8bfc6}
@media(max-width:600px){header{padding-top:22px}.sec h2{font-size:25px}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div>
      <h1 class="brand">بن <b>الغاوي</b></h1>
      <span class="tag">أسعار التيك أواي</span>
      <p class="sub">قهوة، عصاير فريش، سموزي وميلك شيك — اختار وإحنا نجهزهولك</p>
    </div>
    <svg class="cup" viewBox="0 0 200 190" aria-hidden="true">
      <g class="steam" fill="none" stroke="#f6d40c" stroke-width="7" stroke-linecap="round">
        <path d="M70 62c-12-14 12-22 0-38"/><path d="M100 58c-12-14 12-22 0-38"/><path d="M130 62c-12-14 12-22 0-38"/>
      </g>
      <ellipse cx="100" cy="176" rx="82" ry="11" fill="#4d0b17"/>
      <path d="M150 96h12a24 24 0 0 1 0 48h-16" fill="none" stroke="#f6d40c" stroke-width="12"/>
      <path d="M36 82h128l-12 70a26 26 0 0 1-26 22H74a26 26 0 0 1-26-22z" fill="#f6d40c"/>
      <path d="M48 82h20l10 92h-4a26 26 0 0 1-26-22z" fill="#fff" opacity=".35"/>
      <ellipse cx="100" cy="82" rx="64" ry="10" fill="#3a1a0e"/>
      <ellipse cx="88" cy="80" rx="22" ry="4" fill="#7a4a2a"/>
      <g fill="#3a1a0e"><ellipse cx="22" cy="160" rx="10" ry="7" transform="rotate(-30 22 160)"/><ellipse cx="182" cy="150" rx="9" ry="6" transform="rotate(25 182 150)"/></g>
      <g stroke="#f6d40c" stroke-width="2"><path d="M16 164l12-8"/><path d="M176 147l12 6"/></g>
    </svg>
  </div>
</header>

<nav>
  <div class="navin scroll" id="nav"></div>
  <div class="search"><input id="q" type="search" placeholder="دوّر على مشروب… مثلاً: مانجو، لاتيه" aria-label="بحث في المنيو"></div>
</nav>

<main id="menu"><p class="empty" style="display:block">جاري تحميل المنيو…</p></main>
<p class="empty" id="empty">مفيش حاجة بالاسم ده في المنيو</p>

<footer>
  <div class="fin">
    <div><b>العنوان:</b> <span id="addr"></span></div>
    <div><b>للتواصل:</b> <a id="phone" href="#"></a></div>
    <div class="upd" id="upd"></div>
  </div>
</footer>

<script>
{
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const menu=document.getElementById("menu"),nav=document.getElementById("nav"),q=document.getElementById("q"),empty=document.getElementById("empty");
const price=v=>`<span class="p">${esc(v)}<small>ج</small></span>`;
const norm=t=>t.toLowerCase().replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").trim();

function render(D){
  document.getElementById("upd").textContent=D.updated?"آخر تحديث للأسعار: "+D.updated:"";
  document.getElementById("addr").textContent=D.address||"";
  const ph=document.getElementById("phone");ph.textContent=D.phone||"";ph.href="tel:"+(D.phone||"");
  const S=D.sections.filter(s=>s.items&&s.items.length);
  nav.innerHTML=S.map(s=>`<a href="#${esc(s.id)}" data-id="${esc(s.id)}">${esc(s.name)}</a>`).join("");
  menu.innerHTML=S.map(s=>`<section class="sec" id="${esc(s.id)}">
   <h2>${esc(s.name)}${s.flat?`<span class="flat">سعر موحد ${esc(s.flat)} جنيه</span>`:""}</h2>
   ${s.note?`<p class="note">${esc(s.note)}</p>`:""}
   ${s.chips?`<div class="chips">${s.items.map(i=>`<span data-k="${esc(i.n)}">${esc(i.n)}</span>`).join("")}</div>`:
   `<ul>${s.items.map(i=>{const v=i.p||s.flat;return `<li data-k="${esc(i.n+" "+(i.d||""))}"><span class="n">${esc(i.n)}${i.d?`<span class="d">${esc(i.d)}</span>`:""}</span><span class="dots"></span>${v?price(v):""}</li>`}).join("")}</ul>`}
  </section>`).join("");
  const links=[...nav.querySelectorAll("a")];
  const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){links.forEach(a=>a.classList.toggle("on",a.dataset.id===e.target.id));const a=nav.querySelector(".on");a&&nav.scrollTo({left:a.offsetLeft-nav.clientWidth/2+a.clientWidth/2,behavior:"smooth"})}},{rootMargin:"-130px 0px -65% 0px"});
  menu.querySelectorAll(".sec").forEach(s=>io.observe(s));
}
q.addEventListener("input",()=>{
  const t=norm(q.value);let shown=0;
  for(const sec of menu.querySelectorAll(".sec")){
    const hit=norm(sec.querySelector("h2").textContent).includes(t);let any=false;
    for(const el of sec.querySelectorAll("[data-k]")){const ok=!t||hit||norm(el.dataset.k).includes(t);el.style.display=ok?"":"none";any=any||ok}
    sec.style.display=any?"":"none";if(any)shown++;
  }
  empty.style.display=shown?"none":"block";
});
fetch("menu.json?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(render)
 .catch(()=>{menu.innerHTML='<p class="empty" style="display:block">المنيو مش راضي يفتح دلوقتي، جرّب تعمل refresh</p>'});
}
</script>
</body>
</html>
