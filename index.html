<style>
/*
VOICE: دافي وشعبي وواضح، زي كوباية قهوة على ناصية في إمبابة
IDEA: كارت منيو محل بن، بالنبيتي والأصفر بتوع لوجو الغاوي
PICTURE: هيدر نبيتي فيه اللوجو الحقيقي وحبات بن وبخار
COLOUR and TYPE: نبيتي #60101a، أصفر #f9dc0c، كريمي فاتح أو غامق؛ Lalezar للعناوين و Cairo للنص
LAYOUT: هيدر، 3 تابات للمنيوهات، شريط أقسام ثابت، بحث، كروت أقسام
*/
:root{--bg:#fbf7f1;--card:#ffffff;--ink:#2a1216;--soft:#7d5b60;--line:#efe3dc;--chip:#fff3b0;--pc:#7d1724;--seg:#efe5dc;
--wine:#60101a;--wine2:#7a1a26;--yel:#f9dc0c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a0d10;--card:#2a1419;--ink:#f7ece9;--soft:#c7a9ad;--line:#3d2228;--chip:#3a2a0a;--pc:#f9dc0c;--seg:#2a1419;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1a0d10;--card:#2a1419;--ink:#f7ece9;--soft:#c7a9ad;--line:#3d2228;--chip:#3a2a0a;--pc:#f9dc0c;--seg:#2a1419;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Cairo",system-ui,-apple-system,sans-serif;overflow-x:hidden;transition:background .25s,color .25s}
html{scroll-padding-top:150px;scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.steam path{animation:none!important}body{transition:none}}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}

header{background:#60101a;background:radial-gradient(120% 140% at 50% 0%,#7a1a26 0%,#60101a 55%,#4a0b14 100%);color:#fff;position:relative;overflow:hidden;padding:56px max(5vw,18px) 52px;text-align:center}
header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:30px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0;transition:background .25s}
.hbg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.tools{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.tb{height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.tb svg{width:20px;height:20px}
.hwrap{max-width:1100px;margin:0 auto;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.logowrap .bean{position:absolute;height:auto;pointer-events:none;animation:beanDrop 1s cubic-bezier(.3,.7,.4,1) both}
.logowrap .bn1{animation-name:beanDrop1;animation-delay:.55s}
.logowrap .bn2{animation-delay:.8s}
.logowrap .bn3{animation-delay:.95s}
@keyframes beanDrop1{0%{opacity:0;transform:translateY(-160px) rotate(-260deg)}55%{opacity:1;transform:translateY(6px) rotate(12deg)}72%{transform:translateY(-14px) rotate(-6deg)}86%{transform:translateY(2px) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes beanDrop{0%{opacity:0;transform:translateY(-240px) rotate(300deg)}55%{opacity:1;transform:translateY(6px) rotate(-12deg)}72%{transform:translateY(-16px) rotate(6deg)}86%{transform:translateY(2px) rotate(-3deg)}100%{opacity:1;transform:none}}
.logowrap{position:relative;display:inline-block;width:min(400px,78vw)}
.logowrap .logo{width:100%}
.fx{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.fx .st{opacity:0;animation:steamUp 3s ease-in-out infinite}
.fx .s2{animation-delay:-1.3s;animation-duration:3.3s}
@keyframes steamUp{0%{opacity:0;transform:translateY(26px) skewX(4deg)}18%{opacity:1}50%{transform:translateY(-6px) skewX(-7deg)}82%{opacity:1}100%{opacity:0;transform:translateY(-40px) skewX(5deg)}}
.fx .bub{transform-box:fill-box;transform-origin:center;opacity:0;animation:boil 2.2s ease-in infinite}
.fx .b2{animation-delay:.5s;animation-duration:1.9s}.fx .b3{animation-delay:1s;animation-duration:2.4s}.fx .b4{animation-delay:1.4s;animation-duration:2s}.fx .b5{animation-delay:.25s;animation-duration:1.7s}
@keyframes boil{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:.95}75%{opacity:.95;transform:translateY(-55px) scale(1)}90%{opacity:.6;transform:translateY(-62px) scale(1.5)}100%{opacity:0;transform:translateY(-64px) scale(1.8)}}
.logo{width:min(400px,78vw);height:auto;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.tag{display:flex;align-items:center;color:var(--yel);font-weight:800;margin-top:16px;font-size:18px;text-align:center}
.tag i{display:block;flex:none;width:36px;height:2px;border-radius:2px;background:var(--yel);opacity:.8;margin:0 12px}
.sub{margin:6px 0 0;color:#f0d3d8;font-size:15px}
.steam path{animation:rise 3.2s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.8s}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}

nav{position:-webkit-sticky;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);transition:background .25s}
.seg{max-width:640px;margin:0 auto;padding:10px max(4vw,12px) 4px}
.segin{display:flex;background:var(--seg);border:1px solid var(--line);border-radius:16px;padding:4px}
.segin button{flex:1 1 0;border:0;background:transparent;color:var(--ink);font-weight:800;font-size:15px;padding:9px 4px;border-radius:12px;min-height:44px;position:relative;line-height:1.2}
.segin button.on{background:var(--wine);color:#fff;box-shadow:0 3px 10px rgba(96,16,26,.3)}
.segin button .soon{display:block;font-size:10px;font-weight:700;color:var(--soft)}
.segin button.on .soon{color:#f3c9cf}
.navin{max-width:1100px;margin:0 auto;padding:8px max(5vw,14px) 10px;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-weight:700;font-size:14px;min-height:40px;display:flex;align-items:center;margin-inline-end:8px}
.navin a.on{background:var(--yel);color:var(--wine);border-color:var(--yel)}
.search{max-width:1100px;margin:0 auto;padding:16px max(5vw,14px) 0}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);-webkit-appearance:none}
.search input:focus{border-color:var(--wine)}

main{max-width:1100px;margin:0 auto;padding:16px max(5vw,14px) 30px;-webkit-columns:2 460px;columns:2 460px;-webkit-column-gap:18px;column-gap:18px}
.sec{-webkit-column-break-inside:avoid;break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:22px;margin:0 0 18px;overflow:hidden;display:inline-block;width:100%}
.sec h2{margin:0;background:#60101a;background:linear-gradient(90deg,#60101a,#7a1a26);color:#fff;font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:27px;line-height:1.2;padding:14px 20px 10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
html[lang=en] .sec h2{font-family:"Cairo",sans-serif;font-weight:800;font-size:22px;padding:12px 20px}
.flat{font-family:"Cairo",sans-serif;font-size:13px;font-weight:800;background:var(--yel);color:var(--wine);border-radius:999px;padding:3px 12px;white-space:nowrap;margin:2px 0}
.note{margin:0;padding:10px 20px 0;color:var(--soft);font-size:14px}
ul{list-style:none;margin:0;padding:8px 20px 14px}
li{display:flex;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
.n{font-weight:700}
.d{display:block;font-size:13px;color:var(--soft);font-weight:600}
.dots{flex:1;border-bottom:2px dotted var(--line);margin:0 8px;position:relative;top:-4px;min-width:16px}
.p{white-space:nowrap;font-weight:800;color:var(--pc);font-size:18px}
.p small{font-size:12px;font-weight:700;color:var(--soft);margin-inline-start:3px}
.th{flex:none;width:58px;height:58px;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--line);cursor:zoom-in;align-self:center;box-shadow:0 2px 6px rgba(0,0,0,.12);margin-inline-end:12px}
.th img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block}
li.hasimg{align-items:center}
.empty{display:none;text-align:center;color:var(--soft);padding:30px}

.soonbox{max-width:560px;margin:26px auto 40px;padding:0 max(5vw,16px);text-align:center}
.soonbox .card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:34px 24px 30px}
.soonbox svg{width:150px;height:auto;display:block;margin:0 auto 10px}
.soonbox h2{margin:0;font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:40px;color:var(--pc);line-height:1.2}
html[lang=en] .soonbox h2{font-family:"Cairo",sans-serif;font-weight:800;font-size:32px}
.soonbox p{margin:10px 0 18px;color:var(--soft);font-size:16px}
.soonbox button{border:0;background:var(--wine);color:#fff;font-weight:800;border-radius:14px;padding:12px 22px;min-height:46px;margin:4px}
.soonbox button.alt{background:var(--yel);color:var(--wine)}

.lb{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(20,6,9,.9);display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px}
.lb.on{display:flex}
.lb img{max-width:92vw;max-height:72vh;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
@media(min-width:600px){.lb img{max-width:520px}}
.lb p{margin:14px 0 0;color:#fff;font-weight:800;font-size:20px;text-align:center}
.lb p span{color:var(--yel);margin-inline-start:10px}
.lb .x{position:absolute;top:14px;left:14px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px}

.soc{display:flex;justify-content:center;flex-wrap:wrap;margin-top:18px}
.soc a{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;margin:0 6px;min-width:64px}
.soc a .ic{display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:50%;background:var(--yel);color:#60101a;box-shadow:0 4px 0 #b89d00,0 8px 18px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s}
.soc a:active .ic{transform:translateY(3px) scale(.95);box-shadow:0 1px 0 #b89d00,0 3px 8px rgba(0,0,0,.25)}
.soc a svg,.soc a img{width:24px;height:24px;display:block}.sicf{display:flex}
.soc a .lb2{margin-top:8px;font-size:12.5px;font-weight:700;color:#f6dfe3;white-space:nowrap}
.socf{display:flex;flex-wrap:wrap;margin:14px 0 6px}
.socf a{display:flex;align-items:center;text-decoration:none;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(249,220,12,.35);border-radius:999px;padding:5px 16px 5px 5px;margin:0 0 10px;margin-inline-end:10px;font-weight:800;font-size:14px;min-height:46px;transition:transform .15s}
html[dir=rtl] .socf a{padding:5px 5px 5px 16px}
.socf a:active{transform:scale(.96)}
.socf a .ib{width:36px;height:36px;border-radius:50%;background:var(--yel);color:#60101a;display:flex;align-items:center;justify-content:center;margin-inline-end:10px;flex:none}
.socf a .ib svg,.socf a .ib img{width:19px;height:19px;display:block}
@media(prefers-reduced-motion:reduce){.soc a .ic,.socf a{transition:none}}
footer{background:#60101a;color:#fff;padding:26px max(5vw,18px) 34px}
.fin{max-width:1100px;margin:0 auto}
.fin div{margin:4px 0}
.fin b{color:var(--yel)}
.fin a{color:#fff}
.ltr{direction:ltr;unicode-bidi:embed}
.upd{font-size:13px;color:#e8bfc6}
.slog{font-family:"Lalezar","Cairo",sans-serif;color:var(--yel);font-size:22px;margin-bottom:8px!important}
@media(max-width:600px){.sec h2{font-size:24px}.segin button{font-size:14px}}

/* ---------- motion ---------- */
@keyframes logoIn{from{opacity:0;transform:translateY(-16px) scale(.94)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes shine{0%,70%{transform:translateX(-140%) rotate(25deg)}100%{transform:translateX(140%) rotate(25deg)}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(8deg)}}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(249,220,12,.55),0 4px 0 #b89d00}100%{box-shadow:0 0 0 14px rgba(249,220,12,0),0 4px 0 #b89d00}}
.logo{animation:logoIn .9s cubic-bezier(.2,.8,.2,1) both}
.tag{animation:fadeUp .7s .25s both}
.sub{animation:fadeUp .7s .35s both}
.tag i{transform-origin:center;animation:fadeUp .7s .3s both}
.soc a{animation:pop .55s cubic-bezier(.3,1.4,.5,1) both}
.soc a:nth-child(1){animation-delay:.45s}.soc a:nth-child(2){animation-delay:.55s}.soc a:nth-child(3){animation-delay:.65s}.soc a:nth-child(4){animation-delay:.75s}
.soc a .ic{position:relative;overflow:hidden;animation:bob 3.2s ease-in-out infinite}
.soc a:nth-child(2) .ic{animation-delay:.4s}.soc a:nth-child(3) .ic{animation-delay:.8s}.soc a:nth-child(4) .ic{animation-delay:1.2s}
.soc a:first-child .ic{animation:bob 3.2s ease-in-out infinite,ring 2.4s 1.5s ease-out infinite}
.soc a .ic:after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shine 4.5s 1.2s ease-in-out infinite;pointer-events:none}
.soc a:nth-child(2) .ic:after{animation-delay:1.5s}.soc a:nth-child(3) .ic:after{animation-delay:1.8s}.soc a:nth-child(4) .ic:after{animation-delay:2.1s}
.soc a .lb2{animation:fadeUp .5s .9s both}
.hbg .fl{transform-box:fill-box;transform-origin:center;animation:drift 6s ease-in-out infinite}
.hbg .f2{animation-duration:7.5s;animation-delay:-2s}.hbg .f3{animation-duration:8s;animation-delay:-4s}.hbg .f4{animation-duration:6.8s;animation-delay:-1s}
.tools .tb{animation:fadeUp .6s .2s both;transition:background .2s,transform .2s}
.tools .tb:active{transform:scale(.9)}
.tb svg{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.tb.spin svg{transform:rotate(180deg)}
.segin button{transition:background .3s,color .3s,box-shadow .3s,transform .15s}
.segin button:active{transform:scale(.96)}
.navin a{transition:background .25s,color .25s,border-color .25s,transform .15s}
.navin a:active{transform:scale(.95)}
.swap{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
.sec.rv{opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.sec.rv.in{opacity:1;transform:none}
li{transition:background .2s}
li:active{background:rgba(249,220,12,.12)}
.th{transition:transform .2s}.th:active{transform:scale(.92)}
.lb.on img{animation:pop .4s cubic-bezier(.3,1.3,.5,1) both}
.lb.on{animation:fadeUp .25s both}
.soonbox svg{animation:wob 3s ease-in-out infinite;transform-origin:50% 90%}
.socf a .ib{transition:transform .2s}.socf a:active .ib{transform:rotate(-12deg) scale(1.08)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.sec.rv{opacity:1;transform:none}.fx .st{opacity:1}}
</style>
</head>

<script>
(function(){
var T={
 ar:{search:"دوّر على مشروب… مثلاً: مانجو، لاتيه",empty:"مفيش حاجة بالاسم ده في المنيو",flat:"سعر موحد {x} جنيه",addr:"العنوان:",phone:"للتواصل:",upd:"آخر تحديث للأسعار: ",slogan:"كل غاوي وليه مزاج",soonT:"قريباً",soonP:"منيو الصالة بيتجهز… استنونا قريب جداً",goT:"شوف منيو التيك أواي",goB:"منيو البن",soonTab:"قريباً",lang:"EN"},
 en:{search:"Search the menu… e.g. mango, latte",empty:"Nothing matches your search",flat:"All {x} EGP",addr:"Address:",phone:"Contact:",upd:"Prices last updated: ",slogan:"Every coffee lover has a mood of their own",soonT:"Coming soon",soonP:"Our dine-in menu is on its way — stay tuned!",goT:"See takeaway menu",goB:"Coffee beans",soonTab:"Soon",lang:"ع"}
};
var root=document.documentElement;
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
var lang=root.lang==="en"?"en":"ar";
var cur=null;
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function $(id){return document.getElementById(id)}
var menuEl=$("menu"),nav=$("nav"),seg=$("seg"),q=$("q"),empty=$("empty"),soon=$("soon"),searchWrap=$("searchWrap");
function tr(o,f){return lang==="en"&&o[f+"En"]?o[f+"En"]:o[f]}
function nm(o){return lang==="en"&&o.en?o.en:o.n||o.name}
function norm(t){return String(t).toLowerCase().replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/^\s+|\s+$/g,"")}
function findMenu(id){for(var i=0;i<MENU.menus.length;i++)if(MENU.menus[i].id===id)return MENU.menus[i];return null}

/* ---- theme ---- */
var sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function isDark(){var t=root.getAttribute("data-theme");if(t)return t==="dark";return !!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)}
function paintTheme(){var d=isDark();$("themeBtn").innerHTML=d?sun:moon;$("themeBtn").setAttribute("aria-label",d?"Light mode":"Dark mode")}
$("themeBtn").addEventListener("click",function(){var tb=$("themeBtn");tb.className=tb.className.indexOf("spin")>-1?"tb":"tb spin";var t=isDark()?"light":"dark";root.setAttribute("data-theme",t);store("gh_theme",t);paintTheme()});

/* ---- language ---- */
$("langBtn").addEventListener("click",function(){lang=lang==="ar"?"en":"ar";root.lang=lang;root.dir=lang==="ar"?"rtl":"ltr";store("gh_lang",lang);renderAll()});

function renderTabs(){
  var h="";for(var i=0;i<MENU.menus.length;i++){var m=MENU.menus[i];
    h+='<button type="button" role="tab" data-id="'+esc(m.id)+'" class="'+(m.id===cur?"on":"")+'" aria-selected="'+(m.id===cur)+'">'+esc(nm(m))+(m.soon?'<span class="soon">'+T[lang].soonTab+'</span>':'')+'</button>'}
  seg.innerHTML=h;
}
function secHTML(s,m){
  var unit=tr(m,"unit")||"";
  var h='<section class="sec" id="'+esc(s.id)+'"><h2>'+esc(nm(s))+(s.flat?'<span class="flat">'+esc(T[lang].flat.replace("{x}",s.flat))+'</span>':'')+'</h2>';
  var note=tr(s,"note");if(note)h+='<p class="note">'+esc(note)+'</p>';
  h+='<ul>';
  for(var i=0;i<s.items.length;i++){var it=s.items[i];if(it.hide)continue;
    var v=it.p||s.flat,d=lang==="en"&&it.den?it.den:it.d,name=nm(it);
    var pr=v?'<span class="p">'+esc(v)+'<small>'+esc(unit)+'</small></span>':'';
    h+='<li class="'+(it.img?'hasimg':'')+'" data-k="'+esc(it.n+' '+(it.en||'')+' '+(it.d||'')+' '+(it.den||''))+'">'+
      (it.img?'<button type="button" class="th" data-img="'+esc(it.img)+'" data-t="'+esc(name)+'" data-p="'+esc(v?v+' '+unit:'')+'" aria-label="'+esc(name)+'"><img loading="lazy" src="'+esc(it.img)+'" alt=""></button>':'')+
      '<span class="n">'+esc(name)+(d?'<span class="d">'+esc(d)+'</span>':'')+'</span><span class="dots"></span>'+pr+'</li>'}
  return h+'</ul></section>';
}
function replay(el){el.className=el.className.replace(/\s*swap/g,"");void el.offsetWidth;el.className+=" swap"}
var rio=null;
function reveal(){
  try{
    if(!("IntersectionObserver" in window))return;
    if(rio)rio.disconnect();
    var secs=menuEl.querySelectorAll(".sec"),n=0;
    rio=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var s=e.target;s.style.transitionDelay=(Math.min(n++,4)*70)+"ms";s.className+=" in";rio.unobserve(s)}})},{rootMargin:"0px 0px -8% 0px"});
    for(var i=0;i<secs.length;i++){secs[i].className+=" rv";rio.observe(secs[i])}
    setTimeout(function(){n=0},600);
  }catch(e){}
}
function renderMenu(){
  var m=findMenu(cur);
  $("tag").textContent=m.soon?nm(m):tr(m,"tag");
  if(m.soon){
    menuEl.innerHTML="";nav.innerHTML="";nav.style.display="none";searchWrap.style.display="none";empty.style.display="none";soon.style.display="block";
    soon.innerHTML='<div class="card"><svg viewBox="0 0 160 130" aria-hidden="true"><g class="steam" fill="none" stroke="#f9dc0c" stroke-width="6" stroke-linecap="round"><path d="M66 40c-8-10 8-15 0-28"/><path d="M90 40c-8-10 8-15 0-28"/></g><path d="M116 66h8a16 16 0 0 1 0 32h-10" fill="none" stroke="#60101a" stroke-width="9"/><path d="M30 54h96l-8 50a20 20 0 0 1-20 16H58a20 20 0 0 1-20-16z" fill="#60101a"/><path d="M38 60h80l-2 14c-14-10-24 8-40 4s-24-12-36-4z" fill="#f9dc0c"/><ellipse cx="78" cy="124" rx="62" ry="5" fill="#60101a" opacity=".25"/></svg>'+
      '<h2>'+esc(T[lang].soonT)+'</h2><p>'+esc(T[lang].soonP)+'</p><button type="button" data-go="takeaway">'+esc(T[lang].goT)+'</button><button type="button" class="alt" data-go="beans">'+esc(T[lang].goB)+'</button></div>';
    replay(soon);return;
  }
  soon.style.display="none";nav.style.display="";searchWrap.style.display="";
  var S=[],i;for(i=0;i<m.sections.length;i++){var s=m.sections[i],vis=0;for(var j=0;j<s.items.length;j++)if(!s.items[j].hide)vis++;if(vis)S.push(s)}
  var nh="",mh="";for(i=0;i<S.length;i++){nh+='<a href="#'+esc(S[i].id)+'" data-id="'+esc(S[i].id)+'">'+esc(nm(S[i]))+'</a>';mh+=secHTML(S[i],m)}
  nav.innerHTML=nh;menuEl.innerHTML=mh;
  replay(menuEl);reveal();
  q.value="";empty.style.display="none";
  watch();
}
var ICONS={
 whatsapp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 4v-4h0A2.5 2.5 0 0 1 4 13.5z"/><circle cx="8.5" cy="9.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="9.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="9.5" r="1.2" fill="currentColor" stroke="none"/></svg>',
 instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H8l1.5-2h5L16 6h2.5A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>',
 tiktok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="17.5" cy="16" r="2.5" fill="currentColor"/></svg>',
 facebook:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M7 10v11H4V10z"/><path d="M7 10l4-7c1.5 0 2.5 1 2.2 2.6L12.6 9H19a2 2 0 0 1 2 2.3l-1.2 7.5A2.6 2.6 0 0 1 17.2 21H7"/></svg>'};
function renderSocial(){
  var L=MENU.social||[],a="",b="";
  for(var i=0;i<L.length;i++){var s=L[i],lab=nm(s),ic='<img class="sic" src="images/'+esc(s.id)+'.png" alt="" data-id="'+esc(s.id)+'">';
    a+='<a href="'+esc(s.url)+'" target="_blank" rel="noopener"><span class="ic">'+ic+'</span><span class="lb2">'+esc(lab)+'</span></a>';
    b+='<a href="'+esc(s.url)+'" target="_blank" rel="noopener"><span class="ib">'+ic+'</span>'+esc(lab)+'</a>'}
  $("socTop").innerHTML=a;$("socBot").innerHTML=b;
  var imgs=document.querySelectorAll("img.sic");
  for(var k=0;k<imgs.length;k++){(function(im){function fb(){var sp=document.createElement("span");sp.className="sicf";sp.innerHTML=ICONS[im.getAttribute("data-id")]||"";if(im.parentNode)im.parentNode.replaceChild(sp,im)}
    if(im.complete&&!im.naturalWidth)fb();else im.onerror=fb})(imgs[k])}
}
function renderAll(){
  renderSocial();
  q.setAttribute("placeholder",T[lang].search);
  empty.textContent=T[lang].empty;
  $("langBtn").textContent=T[lang].lang;
  $("slogan").textContent=T[lang].slogan;$("fslog").textContent=T[lang].slogan;
  $("lAddr").textContent=T[lang].addr;$("addr").textContent=tr(MENU,"address")||"";
  $("lPhone").textContent=T[lang].phone;var ph=$("phone");ph.textContent=MENU.phone||"";ph.href="tel:"+(MENU.phone||"");
  $("upd").textContent=T[lang].upd+(tr(MENU,"updated")||"");
  document.title=lang==="en"?"El Ghawy Coffee | Menu":"منيو بن الغاوي";
  renderTabs();renderMenu();paintTheme();
}
function setMenu(id,scroll){
  if(!findMenu(id))return;cur=id;store("gh_menu",id);
  try{history.replaceState(null,"","#"+id)}catch(e){}
  renderTabs();renderMenu();
  if(scroll){var top=seg.getBoundingClientRect().top+window.pageYOffset-4;if(window.pageYOffset>top)window.scrollTo(0,top)}
}
seg.addEventListener("click",function(e){var b=e.target.closest?e.target.closest("button"):null;if(b)setMenu(b.getAttribute("data-id"),true)});
soon.addEventListener("click",function(e){var b=e.target.closest?e.target.closest("[data-go]"):null;if(b)setMenu(b.getAttribute("data-go"),true)});

/* ---- active chip while scrolling ---- */
var io=null;
function watch(){
  try{
    if(io)io.disconnect();
    if(!("IntersectionObserver" in window))return;
    var links=nav.querySelectorAll("a");
    io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;
      for(var j=0;j<links.length;j++)links[j].className=links[j].getAttribute("data-id")===e.target.id?"on":"";
      var a=nav.querySelector(".on");if(a){var r=a.getBoundingClientRect(),nr=nav.getBoundingClientRect();nav.scrollLeft+=r.left-nr.left-(nr.width-r.width)/2}})},{rootMargin:"-150px 0px -60% 0px"});
    var secs=menuEl.querySelectorAll(".sec");for(var k=0;k<secs.length;k++)io.observe(secs[k]);
  }catch(e){}
}

/* ---- search ---- */
q.addEventListener("input",function(){
  var t=norm(q.value),shown=0,secs=menuEl.querySelectorAll(".sec");
  for(var i=0;i<secs.length;i++){var sec=secs[i],hit=norm(sec.querySelector("h2").textContent).indexOf(t)>-1,any=false,els=sec.querySelectorAll("[data-k]");
    for(var j=0;j<els.length;j++){var ok=!t||hit||norm(els[j].getAttribute("data-k")).indexOf(t)>-1;els[j].style.display=ok?"":"none";any=any||ok}
    sec.style.display=any?"":"none";if(any)shown++}
  empty.style.display=shown?"none":"block";
});

/* ---- photo viewer ---- */
var lb=$("lb"),lbi=$("lbi"),lbt=$("lbt");
menuEl.addEventListener("click",function(e){var b=e.target.closest?e.target.closest(".th"):null;if(!b)return;lbi.src=b.getAttribute("data-img");lbt.innerHTML=esc(b.getAttribute("data-t"))+(b.getAttribute("data-p")?'<span>'+esc(b.getAttribute("data-p"))+'</span>':'');lb.className="lb on"});
function closeLb(){lb.className="lb";lbi.removeAttribute("src")}
lb.addEventListener("click",function(e){if(e.target!==lbi)closeLb()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeLb()});
if(window.matchMedia){var mq=window.matchMedia("(prefers-color-scheme: dark)");if(mq.addListener)mq.addListener(paintTheme)}

/* ---- start ---- */
var h=(location.hash||"").replace("#","");
cur=findMenu(h)?h:(findMenu(load("gh_menu"))&&!findMenu(load("gh_menu")).soon?load("gh_menu"):"takeaway");
renderAll();
})();
</script>
