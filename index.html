/*
VOICE: دافي وشعبي وواضح، زي كوباية قهوة على ناصية في إمبابة
IDEA: كارت منيو محل بن، بالنبيتي والأصفر بتوع لوجو الغاوي
PICTURE: هيدر نبيتي فيه اللوجو الحقيقي وحبات بن وبخار
COLOUR and TYPE: نبيتي #60101a، أصفر #f9dc0c، كريمي فاتح أو غامق؛ Lalezar للعناوين و Cairo للنص
LAYOUT: هيدر، 3 تابات للمنيوهات، شريط أقسام ثابت، بحث، كروت أقسام
*/
:root{--bg:#fbf7f1;--card:#ffffff;--ink:#2a1216;--soft:#7d5b60;--line:#efe3dc;--chip:#fff3b0;--pc:#7d1724;--seg:#efe5dc;
--wine:#60101a;--wine2:#7a1a26;--yel:#f9dc0c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a0d10;--card:#2a1419;--ink:#f7ece9;--soft:#c7a9ad;--line:#3d2228;--chip:#3a2a0a;--pc:#f9dc0c;--seg:#2a1419;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1a0d10;--card:#2a1419;--ink:#f7ece9;--soft:#c7a9ad;--line:#3d2228;--chip:#3a2a0a;--pc:#f9dc0c;--seg:#2a1419;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Cairo",system-ui,-apple-system,"Geeza Pro",sans-serif;overflow-x:hidden;transition:background .25s,color .25s}
html{scroll-padding-top:150px;scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.steam path{animation:none!important}body{transition:none}}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}

header{background:#60101a;background:radial-gradient(120% 140% at 50% 0%,#7a1a26 0%,#60101a 55%,#4a0b14 100%);color:#fff;position:relative;overflow:hidden;padding:56px max(5vw,18px) 52px;text-align:center}
header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:30px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0;transition:background .25s}
.hbg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.tools{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.tb{height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.tb svg{width:20px;height:20px}
.hwrap{max-width:1100px;margin:0 auto;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.logowrap .bean{position:absolute;height:auto;pointer-events:none;animation:beanDrop 1s cubic-bezier(.3,.7,.4,1) both}
.logowrap .bn1{animation-name:beanDrop1;animation-delay:.55s}
.logowrap .bn2{animation-delay:.8s}
.logowrap .bn3{animation-delay:.95s}
@keyframes beanDrop1{0%{opacity:0;transform:translateY(-160px) rotate(-260deg)}55%{opacity:1;transform:translateY(6px) rotate(12deg)}72%{transform:translateY(-14px) rotate(-6deg)}86%{transform:translateY(2px) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes beanDrop{0%{opacity:0;transform:translateY(-240px) rotate(300deg)}55%{opacity:1;transform:translateY(6px) rotate(-12deg)}72%{transform:translateY(-16px) rotate(6deg)}86%{transform:translateY(2px) rotate(-3deg)}100%{opacity:1;transform:none}}
.logowrap{position:relative;display:inline-block;width:min(400px,78vw)}
.logowrap .logo{width:100%}
.fx{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.fx .st{opacity:0;animation:steamUp 3s ease-in-out infinite}
.fx .s2{animation-delay:-1.3s;animation-duration:3.3s}
@keyframes steamUp{0%{opacity:0;transform:translateY(26px) skewX(4deg)}18%{opacity:1}50%{transform:translateY(-6px) skewX(-7deg)}82%{opacity:1}100%{opacity:0;transform:translateY(-40px) skewX(5deg)}}
.fx .bub{transform-box:fill-box;transform-origin:center;opacity:0;animation:boil 2.2s ease-in infinite}
.fx .b2{animation-delay:.5s;animation-duration:1.9s}.fx .b3{animation-delay:1s;animation-duration:2.4s}.fx .b4{animation-delay:1.4s;animation-duration:2s}.fx .b5{animation-delay:.25s;animation-duration:1.7s}
@keyframes boil{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:.95}75%{opacity:.95;transform:translateY(-55px) scale(1)}90%{opacity:.6;transform:translateY(-62px) scale(1.5)}100%{opacity:0;transform:translateY(-64px) scale(1.8)}}
.logo{width:min(400px,78vw);height:auto;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.tag{display:flex;align-items:center;color:var(--yel);font-weight:800;margin-top:16px;font-size:18px;text-align:center}
.tag i{display:block;flex:none;width:36px;height:2px;border-radius:2px;background:var(--yel);opacity:.8;margin:0 12px}
.sub{margin:6px 0 0;color:#f0d3d8;font-size:15px}
.steam path{animation:rise 3.2s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.8s}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}

nav{position:-webkit-sticky;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);transition:background .25s}
.seg{max-width:640px;margin:0 auto;padding:10px max(4vw,12px) 4px}
.segin{display:flex;background:var(--seg);border:1px solid var(--line);border-radius:16px;padding:4px}
.segin button{flex:1 1 0;border:0;background:transparent;color:var(--ink);font-weight:800;font-size:15px;padding:9px 4px;border-radius:12px;min-height:44px;position:relative;line-height:1.2}
.segin button.on{background:var(--wine);color:#fff;box-shadow:0 3px 10px rgba(96,16,26,.3)}
.segin button .soon{display:block;font-size:10px;font-weight:700;color:var(--soft)}
.segin button.on .soon{color:#f3c9cf}
.navin{max-width:1100px;margin:0 auto;padding:8px max(5vw,14px) 10px;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-weight:700;font-size:14px;min-height:40px;display:flex;align-items:center;margin-inline-end:8px}
.navin a.on{background:var(--yel);color:var(--wine);border-color:var(--yel)}
.search{max-width:1100px;margin:0 auto;padding:16px max(5vw,14px) 0}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);-webkit-appearance:none}
.search input:focus{border-color:var(--wine)}

main{max-width:1100px;margin:0 auto;padding:16px max(5vw,14px) 30px;-webkit-columns:2 460px;columns:2 460px;-webkit-column-gap:18px;column-gap:18px}
.sec{-webkit-column-break-inside:avoid;break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:22px;margin:0 0 18px;overflow:hidden;display:inline-block;width:100%}
.sec h2{margin:0;background:#60101a;background:linear-gradient(90deg,#60101a,#7a1a26);color:#fff;font-family:"Cairo",system-ui,-apple-system,"Geeza Pro",sans-serif;font-weight:900;font-size:27px;line-height:1.2;padding:14px 20px 10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
html[lang=en] .sec h2{font-family:"Cairo",sans-serif;font-weight:800;font-size:22px;padding:12px 20px}
.flat{font-family:"Cairo",sans-serif;font-size:13px;font-weight:800;background:var(--yel);color:var(--wine);border-radius:999px;padding:3px 12px;white-space:nowrap;margin:2px 0}
.note{margin:0;padding:10px 20px 0;color:var(--soft);font-size:14px}
ul{list-style:none;margin:0;padding:8px 20px 14px}
li{display:flex;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
.n{font-weight:700}
.d{display:block;font-size:13px;color:var(--soft);font-weight:600}
.dots{flex:1;border-bottom:2px dotted var(--line);margin:0 8px;position:relative;top:-4px;min-width:16px}
.p{white-space:nowrap;font-weight:800;color:var(--pc);font-size:18px}
.p small{font-size:12px;font-weight:700;color:var(--soft);margin-inline-start:3px}
.th{flex:none;width:58px;height:58px;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--line);cursor:zoom-in;align-self:center;box-shadow:0 2px 6px rgba(0,0,0,.12);margin-inline-end:12px}
.th img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block}
li.hasimg{align-items:center}
.empty{display:none;text-align:center;color:var(--soft);padding:30px}

.soonbox{max-width:560px;margin:26px auto 40px;padding:0 max(5vw,16px);text-align:center}
.soonbox .card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:34px 24px 30px}
.soonbox svg{width:150px;height:auto;display:block;margin:0 auto 10px}

.mood-chips button.sur{background:var(--yel);color:#60101a;border-color:var(--yel)}
.mood-chips button.sur.active{background:#60101a;color:#f9dc0c}
.mood-result{display:none;max-width:560px;margin:16px auto 6px}
.mood-result.show{display:block}
.mr-card{position:relative;overflow:hidden;text-align:center;border-radius:24px;padding:22px 18px 18px;color:#fff;background:radial-gradient(ellipse at 80% 0%,rgba(249,220,12,.22),transparent 55%),linear-gradient(135deg,#4b0b13,#7a1a26 60%,#8b2530);box-shadow:0 14px 34px rgba(96,16,26,.28)}
.mr-card:after{content:"";position:absolute;top:10px;left:10px;right:10px;bottom:10px;border:1px solid rgba(249,220,12,.18);border-radius:18px;pointer-events:none}
.mr-card.pop{animation:mrPop .45s cubic-bezier(.3,1.3,.5,1) both}
@keyframes mrPop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.mr-icon{font-size:34px;line-height:1;margin-bottom:6px;animation:bob 3s ease-in-out infinite}
.mr-kicker{font-size:11px;letter-spacing:.12em;color:#f9dc0c;font-weight:900}
.mr-name{font-size:25px;font-weight:900;margin:4px 0 0;line-height:1.3}
.mr-sec{font-size:12px;color:#f3c9cf;font-weight:700}
.mr-desc{font-size:14px;opacity:.9;margin:8px auto 0;max-width:34ch}
.mr-price{font-weight:900;color:#f9dc0c;font-size:24px;margin-top:8px}
.mr-price small{font-size:13px;color:#f3c9cf}
.mr-btns{display:flex;flex-wrap:wrap;justify-content:center;margin-top:12px;position:relative;z-index:1}
.mr-btns button{border:0;border-radius:999px;font-weight:900;padding:10px 18px;min-height:44px;margin:4px;cursor:pointer;transition:transform .15s}
.mr-btns button:active{transform:scale(.95)}
.mr-btns .go{background:#f9dc0c;color:#60101a}
.mr-btns .again{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
.dice{display:inline-block}.dice.roll{animation:roll .6s ease}
@keyframes roll{to{transform:rotate(360deg)}}
.mr-alt{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.2);position:relative;z-index:1}
.mr-alt span{display:block;font-size:12px;color:#f3c9cf;margin-bottom:6px}
.mr-alt button{border:1px solid rgba(249,220,12,.4);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;margin:3px;font-weight:700;font-size:13px;min-height:36px;cursor:pointer}
@media(prefers-reduced-motion:reduce){.mr-card.pop,.mr-icon,.dice.roll{animation:none}}

/* ===== review fixes: shorter path to the menu, 44px targets, readable small text ===== */
.tb{height:44px;min-width:44px}
.navin a{min-height:44px}
.segin button{min-height:48px}
.segin button .soon{font-size:11px}
#phone{display:inline-block;padding:10px 0}
.mood{margin-top:6px;padding-top:14px;padding-bottom:4px}
.mood-title .eyebrow{font-size:12px;letter-spacing:.06em;direction:inherit}
.mood-title h2{margin-top:2px}
.mood-title p{margin-bottom:10px}
.mood-chips button{min-height:44px}
.mr-alt button{min-height:44px}
@media(max-width:700px){
  .mood-chips{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 2px 8px;scroll-snap-type:x proximity}
  .mood-chips::-webkit-scrollbar{display:none}
  .mood-chips button{flex:none;scroll-snap-align:start}
}
.featured{padding-top:10px}
.featured-head{flex-direction:row!important;align-items:baseline!important;padding-bottom:6px}
.featured-head p{font-size:12px}
.featured-grid{display:flex!important;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 10px;gap:10px}
.featured-grid::-webkit-scrollbar{display:none}
.featured-item{flex:0 0 46%;max-width:190px;min-height:112px!important;scroll-snap-align:start}
@media(min-width:700px){.featured-item{flex-basis:23%}}
.featured-item .ft-label{font-size:11px}
.menu-actions{margin-top:4px}
.menu-actions a{min-height:46px;padding:11px 16px}
.menu-actions a{white-space:nowrap;font-size:15px}.mood-title .eyebrow{display:none}
.swipe-hint{font-size:12px;color:var(--soft);font-weight:700;white-space:nowrap}

/* review card — signature style */
.review{max-width:1100px;margin:6px auto 26px;padding:0 max(5vw,14px)}
.rv-card{position:relative;overflow:hidden;text-align:center;border-radius:26px;padding:26px 20px 22px;color:#fff;background:radial-gradient(ellipse at 50% 0%,rgba(249,220,12,.2),transparent 55%),linear-gradient(145deg,#771b27,#4b0b13 76%);box-shadow:0 14px 34px rgba(96,16,26,.22);opacity:0;transform:translateY(22px) scale(.98);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.rv-card:before{content:"";position:absolute;top:12px;left:12px;right:12px;bottom:12px;border:1px solid rgba(249,220,12,.18);border-radius:20px;pointer-events:none}
.review.on .rv-card{opacity:1;transform:none}
.rv-k{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.08em;color:#f9dc0c}
.rv-stars{display:flex;justify-content:center;margin:10px 0 4px}
.rv-stars .star{width:30px;height:30px;margin:0 3px;fill:#f9dc0c;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));transform:scale(0) rotate(-40deg)}
.review.on .star{animation:starIn .55s cubic-bezier(.3,1.6,.5,1) forwards,twinkle 3s ease-in-out 1.6s infinite}
.review.on .star:nth-child(2){animation-delay:.12s,1.8s}.review.on .star:nth-child(3){animation-delay:.24s,2s}.review.on .star:nth-child(4){animation-delay:.36s,2.2s}.review.on .star:nth-child(5){animation-delay:.48s,2.4s}
@keyframes starIn{to{transform:scale(1) rotate(0)}}
@keyframes twinkle{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.rv-card h2{margin:6px 0 4px;font-family:"Cairo",system-ui,-apple-system,"Geeza Pro",sans-serif;font-weight:900;font-size:28px;line-height:1.3}
html[lang=en] .rv-card h2{font-family:"Cairo",sans-serif;font-weight:900;font-size:24px}
.rv-card p{margin:0 auto 14px;max-width:36ch;font-size:14px;color:#f3d6db}
.rv-btn{position:relative;z-index:1;display:inline-flex;align-items:center;min-height:48px;padding:12px 24px;border-radius:999px;background:#f9dc0c;color:#60101a;font-weight:900;text-decoration:none;box-shadow:0 5px 0 #b89d00,0 10px 22px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s;overflow:hidden}
.rv-btn span{margin-inline-end:8px}
.rv-app{position:relative;z-index:1;display:block;width:max-content;max-width:100%;margin:12px auto 0;padding:10px 6px;color:#f3d6db;font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.rv-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b89d00,0 4px 10px rgba(0,0,0,.25)}
.rv-btn:after{content:"";position:absolute;top:-20%;bottom:-20%;width:35%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:btnShine 3.6s ease-in-out 2s infinite}
@keyframes btnShine{0%,60%{left:-40%}100%{left:120%}}
@media(prefers-reduced-motion:reduce){.rv-card{opacity:1;transform:none;transition:none}.rv-stars .star{transform:none;animation:none!important}.rv-btn:after{animation:none}}

/* ================= cart ================= */
li .add{flex:none;width:40px;height:40px;margin-inline-start:10px;border-radius:50%;border:0;background:var(--yel);color:#60101a;font-weight:900;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #b89d00;transition:transform .15s,background .2s;position:relative}
li .add:before{content:"";position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;border-radius:50%}
li .add.has{background:#60101a;color:#f9dc0c;font-size:15px;box-shadow:0 3px 0 #3c0810}
li .add:active{transform:scale(.88)}
li .add.bump{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.cartbar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:40;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;border:0;border-radius:18px;padding:12px 16px;min-height:58px;background:linear-gradient(120deg,#4b0b13,#7a1a26);color:#fff;font-weight:900;font-size:16px;box-shadow:0 12px 30px rgba(60,8,16,.4)}
.cartbar[hidden]{display:none}
.cartbar.pulse{animation:barIn .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes barIn{0%{transform:translateY(12px) scale(.97)}100%{transform:none}}
.cb-ic{position:relative;font-size:22px}
.cb-ic b{position:absolute;top:-8px;inset-inline-end:-12px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:#f9dc0c;color:#60101a;font-size:12px;display:flex;align-items:center;justify-content:center}
.cb-tot{background:#f9dc0c;color:#60101a;border-radius:999px;padding:5px 12px;font-size:15px}
body.hascart footer{padding-bottom:100px}
.toast{position:fixed;left:50%;bottom:86px;z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1a0d10;color:#fff;border:1px solid rgba(249,220,12,.4);font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;transition:opacity .2s,transform .25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:55}
.sheet[hidden]{display:none}
.sh-bg{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(20,6,9,.55);opacity:0;transition:opacity .25s}
.sheet.on .sh-bg{opacity:1}
.sh-panel{position:absolute;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);color:var(--ink);border-radius:26px 26px 0 0;padding:8px 18px max(18px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sheet.on .sh-panel{transform:none}
.sh-grab{position:relative;width:54px;height:6px;border-radius:6px;background:var(--line);margin:4px auto 8px;cursor:grab;touch-action:none}
.sh-grab:before{content:"";position:absolute;left:-60px;right:-60px;top:-14px;bottom:-14px}
.sh-head{touch-action:none}
.sh-head{display:flex;align-items:center;justify-content:space-between}
.sh-head h2{margin:0;font-family:"Cairo",system-ui,-apple-system,"Geeza Pro",sans-serif;font-weight:900;font-size:26px;color:var(--pc)}
html[lang=en] .sh-head h2{font-family:"Cairo",sans-serif;font-weight:900;font-size:22px}
.sh-x{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:18px;border:1px solid var(--line)}
.sh-empty{text-align:center;color:var(--soft);padding:30px 10px;font-weight:700}
.sh-type{display:flex;background:var(--seg);border:1px solid var(--line);border-radius:16px;padding:4px;margin:12px 0}
.sh-type button{flex:1;border:0;background:transparent;color:var(--ink);font-weight:900;border-radius:12px;min-height:46px;font-size:15px}
.sh-type button.on{background:#60101a;color:#fff;box-shadow:0 3px 10px rgba(96,16,26,.3)}
.sh-list{list-style:none;margin:6px 0 10px;padding:0}
.sh-list li{display:flex;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.sl-e{font-size:20px;margin-inline-end:10px}
.sl-n{flex:1;font-weight:800;line-height:1.35}
.sl-n small{display:block;font-weight:600;color:var(--soft);font-size:12px}
.sl-q{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;margin:0 8px}
.sl-q button{width:38px;height:38px;border:0;background:transparent;color:var(--pc);font-size:20px;font-weight:900;border-radius:50%}
.sl-q b{min-width:26px;text-align:center;font-size:14px;white-space:nowrap}
.sl-t{min-width:64px;text-align:end;font-weight:900;color:var(--pc);white-space:nowrap;font-size:14px}
.sh-f{display:block;margin:10px 0}
.sh-f span{display:block;font-weight:800;font-size:13px;color:var(--soft);margin-bottom:4px}
.sh-f input,.sh-f textarea{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);-webkit-appearance:none}
.sh-f input:focus,.sh-f textarea:focus{border-color:#60101a;outline:3px solid rgba(249,220,12,.6)}
.sh-f input.err{border-color:#c62828;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sh-total{display:flex;justify-content:space-between;align-items:center;margin:14px 0 12px;padding:14px 16px;border-radius:18px;background:linear-gradient(120deg,#4b0b13,#7a1a26);color:#fff;font-weight:900}
.sh-total b{color:#f9dc0c;font-size:22px}
.sh-send{display:flex;align-items:center;justify-content:center;text-decoration:none;width:100%;min-height:54px;border:0;border-radius:16px;background:#f9dc0c;color:#60101a;font-weight:900;font-size:17px;box-shadow:0 5px 0 #b89d00;position:relative;overflow:hidden}
.sh-send:active{transform:translateY(4px);box-shadow:0 1px 0 #b89d00}
.sh-send:after{content:"";position:absolute;top:-20%;bottom:-20%;width:30%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:btnShine 3.2s ease-in-out 1s infinite}
.sh-clear{display:block;margin:10px auto 0;border:0;background:transparent;color:var(--soft);font-weight:800;text-decoration:underline;min-height:44px;padding:0 10px}
.mr-btns .go2{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
@media(prefers-reduced-motion:reduce){.sh-panel,.sh-bg,.toast{transition:none}li .add.bump,.cartbar.pulse,.sh-send:after{animation:none}}

.ctl{flex:none;display:inline-flex;align-items:center;margin-inline-start:10px}
.ctl .add{margin-inline-start:0}
.ctl .qn{min-width:28px;text-align:center;font-weight:900;color:var(--pc);font-size:15px;white-space:nowrap}
.ctl .sub{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--pc);font-weight:900;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;transition:transform .15s;position:relative}
.ctl .sub:before{content:"";position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;border-radius:50%}
.ctl .sub:active{transform:scale(.88)}
.ctl .add.has{background:var(--yel);color:#60101a;font-size:20px;box-shadow:0 3px 0 #b89d00}
.ctl.bump .qn{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@media(max-width:360px){.ctl .sub,.ctl .add{width:36px;height:36px}.ctl .qn{min-width:22px}}

.sec h2{font-size:24px;letter-spacing:0}
@media(max-width:600px){.sec h2{font-size:22px}}
.soonbox h2{font-size:34px}
</style>
