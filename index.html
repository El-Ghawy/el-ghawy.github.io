<style>
/*
VOICE: دافي وشعبي وواضح، زي كوباية قهوة على ناصية في إمبابة
IDEA: كارت منيو مطبوع لمحل بن، بالنبيتي والأصفر بتوع البراند
PICTURE: هيدر نبيتي فيه فنجان قهوة مرسوم وبخار طالع وحبوب بن
COLOUR and TYPE: نبيتي #6e1222 أساسي، أصفر #f6d40c أكسنت، أبيض/كريمي خلفية؛ Lalezar للعناوين و Cairo للنص
LAYOUT: هيدر، شريط أقسام ثابت فوق، بحث، كروت أقسام في عمود واحد على الموبايل وعمودين على الشاشة الكبيرة
*/
:root{color-scheme:light dark;
--bg:light-dark(#fbf7f1,#1a0d10);--card:light-dark(#ffffff,#2a1419);--ink:light-dark(#2a1216,#f7ece9);
--soft:light-dark(#7d5b60,#c7a9ad);--line:light-dark(#efe3dc,#3d2228);
--wine:#60101a;--wine2:#7d1724;--yel:#f9dc0c;--chip:light-dark(#fff3b0,#3a2a0a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Cairo",system-ui,sans-serif;overflow-x:clip}
html{scroll-padding-top:120px;scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.steam path{animation:none!important}}

header{background:radial-gradient(120% 140% at 50% 0%,#7a1a26 0%,#60101a 55%,#4a0b14 100%);color:#fff;position:relative;overflow:hidden;padding:34px max(5vw,18px) 52px;text-align:center}
header::after{content:"";position:absolute;inset:auto 0 -1px 0;height:30px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.hbg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hwrap{max-width:1100px;margin:0 auto;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.logo{width:min(420px,82vw);height:auto;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.tag{display:flex;align-items:center;gap:12px;color:var(--yel);font-weight:800;margin-top:16px;font-size:18px;white-space:nowrap}
.tag i{display:block;width:44px;height:2px;border-radius:2px;background:var(--yel);opacity:.8}
.sub{margin:8px 0 0;color:#f0d3d8;font-size:15px}
.steam path{animation:rise 3.2s ease-in-out infinite;transform-box:fill-box}
.steam path:nth-child(2){animation-delay:.8s}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}

nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.navin{max-width:1100px;margin:0 auto;padding:10px max(5vw,14px) 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px;min-height:42px;display:flex;align-items:center}
.navin a.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.search{max-width:1100px;margin:0 auto;padding:0 max(5vw,14px) 10px}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.search input:focus{outline:3px solid var(--yel);border-color:var(--wine)}

main{max-width:1100px;margin:0 auto;padding:18px max(5vw,14px) 30px;columns:2 460px;column-gap:18px}
.sec{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:22px;margin:0 0 18px;overflow:hidden;display:inline-block;width:100%}
.sec h2{margin:0;background:linear-gradient(90deg,#60101a,#7a1a26);color:#fff;font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:28px;line-height:1.2;padding:14px 20px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.flat{font-family:"Cairo",sans-serif;font-size:14px;font-weight:800;background:var(--yel);color:var(--wine);border-radius:999px;padding:3px 12px;white-space:nowrap}
.note{margin:0;padding:10px 20px 0;color:var(--soft);font-size:14px}
ul{list-style:none;margin:0;padding:8px 20px 14px}
li{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
.n{font-weight:700}
.d{display:block;font-size:13px;color:var(--soft);font-weight:600}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.p{white-space:nowrap;font-weight:800;color:var(--wine2);font-size:18px}
:root[data-theme=dark] .p{color:var(--yel)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .p{color:var(--yel)}}
.p small{font-size:12px;font-weight:700;color:var(--soft);margin-inline-start:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px 18px}
.chips span{background:var(--chip);border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px}
.empty{display:none;text-align:center;color:var(--soft);padding:30px;column-span:all}

footer{background:var(--wine);color:#fff;padding:26px max(5vw,18px) 34px}
.fin{max-width:1100px;margin:0 auto;display:grid;gap:8px}
.fin b{color:var(--yel)}
.fin a{color:#fff}
.upd{font-size:13px;color:#e8bfc6}
@media(max-width:600px){header{padding-top:22px}.sec h2{font-size:25px}}
</style>
</head>

<script>
(function(){
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var menu=document.getElementById("menu"),nav=document.getElementById("nav"),q=document.getElementById("q"),empty=document.getElementById("empty");
function price(v){return '<span class="p">'+esc(v)+'<small>ج</small></span>'}
function norm(t){return String(t).toLowerCase().replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").trim()}
function secHTML(s){
  var h='<section class="sec" id="'+esc(s.id)+'"><h2>'+esc(s.name)+(s.flat?'<span class="flat">سعر موحد '+esc(s.flat)+' جنيه</span>':'')+'</h2>';
  if(s.note)h+='<p class="note">'+esc(s.note)+'</p>';
  var items=s.items||[],i,it,v;
  if(s.chips){h+='<div class="chips">';for(i=0;i<items.length;i++)h+='<span data-k="'+esc(items[i].n)+'">'+esc(items[i].n)+'</span>';h+='</div>'}
  else{h+='<ul>';for(i=0;i<items.length;i++){it=items[i];v=it.p||s.flat;
    h+='<li data-k="'+esc(it.n+' '+(it.d||''))+'"><span class="n">'+esc(it.n)+(it.d?'<span class="d">'+esc(it.d)+'</span>':'')+'</span><span class="dots"></span>'+(v?price(v):'')+'</li>'}
    h+='</ul>'}
  return h+'</section>';
}
function render(D){
  var S=(D.sections||[]).filter(function(s){return s.items&&s.items.length}),i,navH='',menuH='';
  for(i=0;i<S.length;i++){navH+='<a href="#'+esc(S[i].id)+'" data-id="'+esc(S[i].id)+'">'+esc(S[i].name)+'</a>';menuH+=secHTML(S[i])}
  nav.innerHTML=navH;menu.innerHTML=menuH;
  document.getElementById("upd").textContent=D.updated?"آخر تحديث للأسعار: "+D.updated:"";
  document.getElementById("addr").textContent=D.address||"";
  var ph=document.getElementById("phone");ph.textContent=D.phone||"";ph.href="tel:"+(D.phone||"");
  try{
    if(!("IntersectionObserver" in window))return;
    var links=nav.querySelectorAll("a");
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;
      for(var j=0;j<links.length;j++)links[j].className=links[j].getAttribute("data-id")===e.target.id?"on":"";
      var a=nav.querySelector(".on");if(a)nav.scrollLeft=a.offsetLeft-nav.clientWidth/2+a.clientWidth/2;})},{rootMargin:"-130px 0px -65% 0px"});
    var secs=menu.querySelectorAll(".sec");for(var k=0;k<secs.length;k++)io.observe(secs[k]);
  }catch(e){}
}
q.addEventListener("input",function(){
  var t=norm(q.value),shown=0,secs=menu.querySelectorAll(".sec");
  for(var i=0;i<secs.length;i++){var sec=secs[i],hit=norm(sec.querySelector("h2").textContent).indexOf(t)>-1,any=false,els=sec.querySelectorAll("[data-k]");
    for(var j=0;j<els.length;j++){var ok=!t||hit||norm(els[j].getAttribute("data-k")).indexOf(t)>-1;els[j].style.display=ok?"":"none";any=any||ok}
    sec.style.display=any?"":"none";if(any)shown++}
  empty.style.display=shown?"none":"block";
});
function fail(msg){menu.innerHTML='<p class="empty" style="display:block">المنيو مش راضي يفتح دلوقتي، جرّب تعمل refresh<br><small style="opacity:.6">'+esc(msg)+'</small></p>'}
try{render(MENU)}catch(e){fail("render: "+e.message)}
})();
</script>
